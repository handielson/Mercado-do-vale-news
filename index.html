<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/mdv-favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/mdv-favicon-48x48.png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/mdv-apple-touch-icon.png" sizes="180x180" />

  <!-- Pre-conexão com origens críticas (economia ~300ms na LCP por origem) -->
  <!-- Sem crossorigin pq são fetches same-policy (não exigem credenciais) -->
  <link rel="preconnect" href="https://api.xiaomipetrolina.com.br" />
  <link rel="dns-prefetch" href="https://brasilapi.com.br" />
  <link rel="dns-prefetch" href="https://api.open-meteo.com" />
  <link rel="dns-prefetch" href="https://geocoding-api.open-meteo.com" />

  <title>Mercado do Vale | Smartphones e Eletrônicos em Petrolina-PE</title>
  <meta name="description" content="Mercado do Vale — Smartphones Xiaomi, Samsung, iPhones e eletrônicos com os melhores preços em Petrolina-PE. Compre online com entrega rápida e garantia!" />
  <link rel="canonical" href="https://mercadodovale.com.br/" />

  <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mercado do Vale" />
  <meta property="og:title" content="Mercado do Vale | Smartphones e Eletrônicos em Petrolina-PE" />
  <meta property="og:description" content="Smartphones Xiaomi, Samsung, iPhones e eletrônicos com os melhores preços. Entrega em Petrolina e região." />
  <meta property="og:image" content="https://mercadodovale.com.br/og-cover.jpg" />
  <meta property="og:url" content="https://mercadodovale.com.br/" />
  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mercado do Vale | Smartphones e Eletrônicos" />
  <meta name="twitter:description" content="Smartphones Xiaomi, Samsung, iPhones e eletrônicos com os melhores preços em Petrolina-PE." />
  <meta name="twitter:image" content="https://mercadodovale.com.br/og-cover.jpg" />
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f8fafc; color: #0f172a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .initial-shell { min-height: 100vh; background: #f8fafc; }
    .initial-header { position: sticky; top: 0; z-index: 1; background: #fff; border-bottom: 1px solid #e2e8f0; box-shadow: 0 1px 3px rgba(15, 23, 42, .08); }
    .initial-header-inner, .initial-main { max-width: 80rem; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
    .initial-header-inner { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .initial-brand, .initial-actions { display: flex; align-items: center; gap: .75rem; }
    .initial-logo { width: 40px; height: 40px; border-radius: 10px; background: #dbeafe; }
    .initial-mobile-search { position: sticky; top: 64px; z-index: 2; display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem; background: #fff; border-bottom: 1px solid #e2e8f0; box-shadow: 0 1px 3px rgba(15, 23, 42, .08); }
    .initial-mobile-input { flex: 1; height: 40px; border-radius: 12px; background: #f1f5f9; }
    .initial-mobile-button { width: 40px; height: 40px; border-radius: 12px; background: #f1f5f9; }
    .initial-main { padding-top: 2rem; padding-bottom: 2rem; }
    .initial-banner { aspect-ratio: 21 / 9; width: 100%; border-radius: 14px; background: #e2e8f0; margin-bottom: 1rem; }
    .initial-checkin-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: 1rem 0 1.25rem; }
    .initial-favorites { width: 96px; height: 40px; border-radius: 999px; background: #fff; border: 1px solid #e2e8f0; }
    .initial-checkin { width: 210px; max-width: 58vw; height: 52px; border-radius: 999px; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(15, 23, 42, .05); }
    .initial-search { display: none; height: 48px; border-radius: 16px; background: #fff; border: 1px solid #e2e8f0; margin: 1rem 0 1.5rem; }
    .initial-controls { display: flex; align-items: stretch; gap: .5rem; margin: 1.25rem 0 1rem; }
    .initial-control-square { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 10px; background: #fff; border: 1px solid #e2e8f0; }
    .initial-control-wide { width: 152px; max-width: 44vw; height: 40px; flex: 0 0 auto; border-radius: 10px; background: #fff; border: 1px solid #e2e8f0; }
    .initial-collections { display: flex; gap: .5rem; overflow: hidden; margin: 0 0 1.5rem; }
    .initial-chip { height: 30px; flex: 0 0 auto; border-radius: 999px; background: #fff; border: 1px solid #e2e8f0; }
    .initial-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    .initial-card { overflow: hidden; border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; }
    .initial-photo { aspect-ratio: 4 / 3; background: #e2e8f0; }
    .initial-card-body { padding: .75rem; }
    .initial-skel { display: block; border-radius: 999px; background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 37%, #e2e8f0 63%); background-size: 400% 100%; animation: initial-shimmer 1.4s ease infinite; }
    .initial-title { width: 170px; max-width: 100%; height: 16px; }
    .initial-small { width: 92px; height: 12px; margin-top: 8px; }
    .initial-price { width: 120px; height: 20px; margin-top: 14px; }
    .initial-pill { width: 92px; height: 34px; border-radius: 10px; }
    @keyframes initial-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    @media (min-width: 640px) {
      .initial-mobile-search, .initial-checkin-row { display: none; }
      .initial-main { padding-top: 1.5rem; }
      .initial-controls { margin-top: 1rem; justify-content: flex-end; }
      .initial-control-square { display: none; }
      .initial-search { display: block; }
      .initial-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div id="root">
    <div class="initial-shell" aria-label="Carregando Mercado do Vale">
      <header class="initial-header">
        <div class="initial-header-inner">
          <div class="initial-brand">
            <div class="initial-logo initial-skel"></div>
            <div>
              <span class="initial-skel initial-title"></span>
              <span class="initial-skel initial-small"></span>
            </div>
          </div>
          <div class="initial-actions">
            <span class="initial-skel initial-pill"></span>
          </div>
        </div>
      </header>
      <div class="initial-mobile-search">
        <div class="initial-mobile-input initial-skel"></div>
        <div class="initial-mobile-button initial-skel"></div>
      </div>
      <main class="initial-main">
        <div class="initial-banner initial-skel"></div>
        <div class="initial-checkin-row">
          <div class="initial-favorites initial-skel"></div>
          <div class="initial-checkin initial-skel"></div>
        </div>
        <div class="initial-search"></div>
        <div class="initial-controls" aria-hidden="true">
          <div class="initial-control-square initial-skel"></div>
          <div class="initial-control-wide initial-skel"></div>
          <div class="initial-control-wide initial-skel"></div>
        </div>
        <div class="initial-collections">
          <span class="initial-chip initial-skel" style="width: 126px"></span>
          <span class="initial-chip initial-skel" style="width: 82px"></span>
          <span class="initial-chip initial-skel" style="width: 96px"></span>
          <span class="initial-chip initial-skel" style="width: 110px"></span>
        </div>
        <div class="initial-grid">
          <div class="initial-card"><div class="initial-photo initial-skel"></div><div class="initial-card-body"><span class="initial-skel initial-title"></span><span class="initial-skel initial-small"></span><span class="initial-skel initial-price"></span></div></div>
          <div class="initial-card"><div class="initial-photo initial-skel"></div><div class="initial-card-body"><span class="initial-skel initial-title"></span><span class="initial-skel initial-small"></span><span class="initial-skel initial-price"></span></div></div>
          <div class="initial-card"><div class="initial-photo initial-skel"></div><div class="initial-card-body"><span class="initial-skel initial-title"></span><span class="initial-skel initial-small"></span><span class="initial-skel initial-price"></span></div></div>
          <div class="initial-card"><div class="initial-photo initial-skel"></div><div class="initial-card-body"><span class="initial-skel initial-title"></span><span class="initial-skel initial-small"></span><span class="initial-skel initial-price"></span></div></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
