# Mercado do Vale - VPS production frontend
#
# Install target example:
#   /etc/nginx/sites-available/mdv-site-production.conf
#   /etc/nginx/sites-enabled/mdv-site-production.conf
#
# The root host redirects to the canonical www host. The www host serves the
# Vite build from /var/www/mdv-site/current and reserves SEO/API routes before
# the SPA fallback.

#
# HTTPS is handled here too because Cloudflare currently connects to the
# origin on 443. Until a dedicated Mercado do Vale origin certificate is
# installed, this uses the certificate already accepted by the Cloudflare
# edge for the VPS origin.

server {
    listen 80;
    server_name mercadodovale.com.br;

    return 301 https://www.mercadodovale.com.br$request_uri;
}

server {
    listen 443 ssl;
    server_name mercadodovale.com.br;

    ssl_certificate /etc/letsencrypt/live/api.xiaomipetrolina.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xiaomipetrolina.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://www.mercadodovale.com.br$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name www.mercadodovale.com.br mv.mercadodovale.com.br;

    ssl_certificate /etc/letsencrypt/live/api.xiaomipetrolina.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xiaomipetrolina.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/mdv-site/current;
    index index.html;

    client_max_body_size 500M;

    if ($args ~* "(^|&)(add-to-cart|add-to-compare)=") {
        return 301 https://www.mercadodovale.com.br$uri;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/status {
        proxy_pass http://127.0.0.1:4000/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /vps-proxy {
        proxy_pass http://127.0.0.1:4000/api/vps-proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/api/sitemap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Feeds do WordPress removido nao sao paginas de produto.
    location ~ ^/produto/[^/]+/feed/?$ {
        return 410;
    }

    # O ID numerico antigo nao identifica um produto atual: resolver pelo slug.
    location ~ ^/produto/([^/]+)/[0-9]+/?$ {
        proxy_pass http://127.0.0.1:4000/api/seo-produto?slug=$1&legacy=1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Normaliza variantes legadas do WooCommerce antes de servir o HTML SEO.
    location ~ ^/produto/([^/]+)/$ {
        return 301 https://www.mercadodovale.com.br/produto/$1;
    }

    location ~ ^/produto/([^/]+)$ {
        proxy_pass http://127.0.0.1:4000/api/seo-produto?slug=$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ~ ^/loja-3d/produto/([^/]+)/$ {
        return 301 https://www.mercadodovale.com.br/loja-3d/produto/$1;
    }

    location ~ ^/loja-3d/produto/([^/]+)$ {
        proxy_pass http://127.0.0.1:4000/api/seo-produto-3d?slug=$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ^~ /categoria-produtos/ {
        proxy_pass http://127.0.0.1:4000/api/seo-legacy-category;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /loja/ {
        return 301 https://www.mercadodovale.com.br/produtos;
    }

    location ^~ /wp-content/ {
        return 410;
    }

    location ^~ /wp-includes/ {
        return 410;
    }

    location ^~ /wp-admin/ {
        return 410;
    }

    location ~ ^/(?:wp-login\\.php|xmlrpc\\.php|feed)/?$ {
        return 410;
    }

    location = /catalog {
        return 301 https://www.mercadodovale.com.br/;
    }

    location = /sobre/ {
        return 301 https://www.mercadodovale.com.br/quem-somos;
    }

    location ^~ /tags-produtos/ {
        return 410;
    }

    location ^~ /variacoes/ {
        return 410;
    }

    # BEGIN GENERATED SPA ROUTES - npm/node scripts/sync-nginx-spa-routes.cjs
    # Valid application routes only. Keep product SEO locations above this rule.
    location ~ "^(?:/|/acompanhar-entrega/[^/]+|/admin|/admin/avaliacoes|/admin/caixa|/admin/caixa/auditoria|/admin/calcular-frete|/admin/cashback|/admin/catalog-config|/admin/compras|/admin/compras/[^/]+/orcamentos|/admin/compras/fornecedores|/admin/contabilidade|/admin/coupons|/admin/customers|/admin/customers/[^/]+|/admin/customers/[^/]+/edit|/admin/customers/[^/]+/preview|/admin/customers/new|/admin/feedbacks|/admin/financeiro|/admin/financeiro/crediario|/admin/financial/crediario|/admin/inventory|/admin/inventory/locations)/?$" {
        try_files $uri $uri/ /index.html;
    }
    location ~ "^(?:/admin/inventory/print-list|/admin/login|/admin/loja-3d/banners|/admin/loja-3d/calculadora|/admin/loja-3d/catalogo|/admin/loja-3d/clientes|/admin/loja-3d/configuracoes|/admin/loja-3d/pedidos|/admin/loja-3d/producao|/admin/loja-3d/solicitacoes|/admin/pdv|/admin/pedidos-online|/admin/pix-avulso|/admin/products|/admin/products/[^/]+(?:/[^/]+)?|/admin/products/bulk|/admin/products/combos|/admin/products/image-bank|/admin/products/labels|/admin/products/models/[^/]+|/admin/products/new|/admin/products/offers|/admin/products/photo-intake|/admin/products/print3d-cost|/admin/products/print3d-production)/?$" {
        try_files $uri $uri/ /index.html;
    }
    location ~ "^(?:/admin/products/storefronts|/admin/promotions|/admin/relatorios/favoritos|/admin/sales|/admin/serializados|/admin/settings/banners|/admin/settings/battery-healths|/admin/settings/bling|/admin/settings/bling/callback|/admin/settings/brands|/admin/settings/catalog|/admin/settings/categories|/admin/settings/categories/[^/]+/edit|/admin/settings/categories/new|/admin/settings/categories/presets|/admin/settings/colors|/admin/settings/company|/admin/settings/custom-fields|/admin/settings/displays|/admin/settings/documents|/admin/settings/email|/admin/settings/fields|/admin/settings/integrations|/admin/settings/marketing|/admin/settings/mercado-livre)/?$" {
        try_files $uri $uri/ /index.html;
    }
    location ~ "^(?:/admin/settings/mercado-livre/preparacao|/admin/settings/models|/admin/settings/mysql|/admin/settings/payment-fees|/admin/settings/permissions|/admin/settings/rams|/admin/settings/seo-analyzer|/admin/settings/seo-blacklist|/admin/settings/shipping|/admin/settings/shopee|/admin/settings/shopee/templates|/admin/settings/storages|/admin/settings/synology-cdn|/admin/settings/synology-config|/admin/settings/system-backup|/admin/settings/system-status|/admin/settings/system-tags|/admin/settings/telegram|/admin/settings/tiktok-shop|/admin/settings/versions|/admin/settings/vps-status|/admin/settings/warranty-templates|/admin/settings/whatsapp|/admin/solicitacoes-prazo|/admin/team)/?$" {
        try_files $uri $uri/ /index.html;
    }
    location ~ "^(?:/admin/team/[^/]+/edit|/admin/team/new|/admin/whatsapp/mensagens|/admin/whatsapp/novo-bot|/auth/callback|/c|/calculadora-orcamento|/carrinho|/checkout|/cliente/cadastro|/cliente/login|/completar-cadastro|/contador|/delivery/[^/]+|/display|/exclusao-de-dados|/faq|/favoritos|/garantia-estendida|/login|/loja-3d|/loja-3d/checkout|/loja-3d/conta|/loja-3d/conta/google/callback|/loja-3d/conta/producao)/?$" {
        try_files $uri $uri/ /index.html;
    }
    location ~ "^(?:/loja-3d/pedidos|/loja-3d/produto/[^/]+|/moedas-do-vale|/pedido/[^/]+|/pedido/[^/]+/confirmacao|/perfil|/pix/[^/]+|/privacidade|/produto/[^/]+|/produtos|/produtos/destaques|/produtos/mais-recentes|/produtos/mais-vendidos|/promocoes|/promocoes/pelicula-gratis|/quem-somos|/receipt-share/[^/]+|/recuperar-senha|/redefinir-senha|/store|/termos-de-uso|/test-tabs|/totem-pix/atualizar)/?$" {
        try_files $uri $uri/ /index.html;
    }
    # END GENERATED SPA ROUTES

    location / {
        try_files $uri $uri/ =404;
    }
}
