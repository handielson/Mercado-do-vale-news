# Mercado do Vale - VPS staging frontend
#
# Install target example:
#   /etc/nginx/sites-available/mdv-site-staging.conf
#   /etc/nginx/sites-enabled/mdv-site-staging.conf
#
# This staging host serves the Vite build from /var/www/mdv-site/current.
# The current symlink is managed by scripts/deploy-vps-site.cjs.

server {
    listen 80;
    server_name staging.mercadodovale.com.br;

    root /var/www/mdv-site/current;
    index index.html;

    client_max_body_size 500M;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001/api/sitemap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ~ ^/produto/([^/]+)$ {
        proxy_pass http://127.0.0.1:3001/api/seo-produto?slug=$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
