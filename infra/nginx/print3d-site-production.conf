# 3D do Vale - storefront isolado

server {
    listen 80;
    server_name 3dmv.com.br;
    return 301 https://www.3dmv.com.br$request_uri;
}

server {
    listen 443 ssl;
    server_name 3dmv.com.br;

    ssl_certificate /etc/letsencrypt/live/api.xiaomipetrolina.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xiaomipetrolina.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.3dmv.com.br$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name www.3dmv.com.br;

    ssl_certificate /etc/letsencrypt/live/api.xiaomipetrolina.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xiaomipetrolina.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/print3d-site/current;
    index index.html;
    client_max_body_size 100M;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /vps-proxy {
        proxy_pass http://127.0.0.1:4000/api/vps-proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/api/sitemap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/loja-3d/produto/([^/]+)/$ {
        return 301 https://www.3dmv.com.br/loja-3d/produto/$1;
    }

    location ~ ^/loja-3d/produto/([^/]+)$ {
        proxy_pass http://127.0.0.1:4000/api/seo-produto-3d?slug=$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
