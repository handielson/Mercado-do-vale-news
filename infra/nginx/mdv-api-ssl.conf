# Mercado do Vale - API pública
#
# Fonte versionada da configuração ativa em:
#   /etc/nginx/sites-available/mdv-api-ssl
#   /etc/nginx/sites-enabled/mdv-api-ssl

server {
    listen 80;
    listen [::]:80;
    server_name api.xiaomipetrolina.com.br;
    client_max_body_size 500m;

    set $cors_origin "";
    if ($http_origin ~* "^https://(www\.)?(mercadodovale\.com\.br|xiaomipetrolina\.com\.br)$") {
        set $cors_origin $http_origin;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept, Content-Type, Authorization, X-Sync-Key' always;
            add_header 'Vary' 'Origin' always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept, Content-Type, Authorization, X-Sync-Key' always;
        add_header 'Vary' 'Origin' always;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.xiaomipetrolina.com.br;
    client_max_body_size 500m;

    ssl_certificate /etc/letsencrypt/live/api.xiaomipetrolina.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xiaomipetrolina.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    set $cors_origin "";
    if ($http_origin ~* "^https://(www\.)?(mercadodovale\.com\.br|xiaomipetrolina\.com\.br)$") {
        set $cors_origin $http_origin;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept, Content-Type, Authorization, X-Sync-Key' always;
            add_header 'Vary' 'Origin' always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept, Content-Type, Authorization, X-Sync-Key' always;
        add_header 'Vary' 'Origin' always;
    }
}
